name: Export gated Brunova image for private deployment

on:
  workflow_dispatch:
    inputs:
      digest:
        description: Immutable GHCR digest from a successful Brunova PoC image security run
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check digest syntax
        env:
          DIGEST: ${{ inputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo 'Expected sha256 digest'; exit 1; }

      - name: Login to private GHCR package
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Export exact published image
        env:
          DIGEST: ${{ inputs.digest }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          image="ghcr.io/${REPO,,}@$DIGEST"
          transport="ghcr.io/${REPO,,}:transport-${DIGEST#sha256:}"
          docker pull --platform linux/amd64 "$image"
          docker tag "$image" "$transport"
          docker save "$transport" | gzip -1 > openwa-image.tar.gz
          sha256sum openwa-image.tar.gz > openwa-image.tar.gz.sha256
          printf 'origin=%s\ntransport=%s\n' "$image" "$transport" > openwa-image-origin.txt

      - name: Upload private transport artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openwa-private-image-${{ inputs.digest }}
          path: |
            openwa-image.tar.gz
            openwa-image.tar.gz.sha256
            openwa-image-origin.txt
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
